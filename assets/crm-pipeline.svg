<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Flujo conceptual de integración hacia CRM</title>
  <desc id="desc">Cuatro fuentes pasan por staging, normalización y deduplicación antes de llegar al CRM, con una pista de auditoría por ejecución.</desc>
  <rect width="1200" height="360" fill="#211b28" rx="24"/>
  <g fill="#f7f2f7" font-family="Arial, sans-serif" text-anchor="middle">
    <g stroke="#f08fc3" stroke-width="2">
      <rect x="54" y="96" width="210" height="108" rx="14" fill="#2a2231"/>
      <rect x="332" y="96" width="190" height="108" rx="14" fill="#2a2231"/>
      <rect x="590" y="96" width="300" height="108" rx="14" fill="#2a2231"/>
      <rect x="958" y="96" width="188" height="108" rx="14" fill="#2a2231"/>
    </g>
    <g fill="none" stroke="#ff3ea5" stroke-width="4" stroke-linecap="round">
      <path d="M264 150h52"/><path d="M522 150h52"/><path d="M890 150h52"/>
    </g>
    <g fill="#ff3ea5">
      <path d="m316 143 13 7-13 7z"/><path d="m574 143 13 7-13 7z"/><path d="m942 143 13 7-13 7z"/>
    </g>
    <g font-size="23" font-weight="700">
      <text x="159" y="145">4 fuentes</text>
      <text x="427" y="145">Staging</text>
      <text x="740" y="137">Normalización y</text><text x="740" y="165">deduplicación</text>
      <text x="1052" y="145">CRM</text>
    </g>
    <g fill="#c4bac7" font-size="15">
      <text x="159" y="174">Entradas independientes</text>
      <text x="427" y="174">Preparación común</text>
      <text x="740" y="190">Reglas antes del destino</text>
      <text x="1052" y="174">Registro consolidado</text>
    </g>
  </g>
  <g fill="none" stroke="#e92e68" stroke-width="2"><path d="M159 224v44h893v-44"/></g>
  <circle cx="159" cy="224" r="5" fill="#e92e68"/><circle cx="1052" cy="224" r="5" fill="#e92e68"/>
  <text x="605" y="310" fill="#f08fc3" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Auditoría de cada ejecución</text>
</svg>
